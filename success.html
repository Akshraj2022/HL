<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2865389325309773"
     crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-2865389325309773">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Hikaru Labs</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #000000;
            --border-color: #222222;
            --accent: #bfa15f;
            --accent-hover: #d4b472;
            --text-main: #ededed;
            --text-muted: #888888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body, html {
            background-color: var(--bg-dark); 
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .success-container {
            text-align: center;
            max-width: 500px;
            padding: 3rem;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .check-wrapper {
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 2.5rem auto;
            box-shadow: 0 0 30px rgba(191, 161, 95, 0.2);
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        .check-icon {
            width: 48px; height: 48px;
            color: var(--accent);
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawCheck 0.8s ease-out 0.6s forwards;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.03em;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 3rem;
        }

        p strong { color: var(--accent); }

        .btn-workspace {
            display: inline-block;
            background: linear-gradient(135deg, #2a2a2d 0%, #1a1a1c 100%);
            border: 1px solid rgba(191, 161, 95, 0.4);
            color: var(--accent);
            padding: 1rem 3rem;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4), 0 0 15px rgba(191, 161, 95, 0.15);
        }

        .btn-workspace:hover {
            background: linear-gradient(135deg, #323236 0%, #222225 100%);
            border-color: var(--accent);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 30px rgba(191, 161, 95, 0.4);
            transform: translateY(-3px) scale(1.02);
        }

        .btn-workspace:active { transform: scale(0.97); }

    </style>
</head>
<body>

    <div class="success-container">
        <div class="check-wrapper">
            <svg class="check-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h1>Payment Successful</h1>
        <p>Thank you for upgrading to the <strong id="plan-display">Premium</strong> plan. Your workspace has been instantly unlocked.</p>
        
        <a href="browse.html" class="btn-workspace">Enter Workspace</a>
    </div>

    <script>
        // Retrieve the plan name from the URL to personalize the message
        const urlParams = new URLSearchParams(window.location.search);
        const plan = urlParams.get('plan');
        
        if (plan) {
            document.getElementById('plan-display').textContent = plan;
        }

        // Fire confetti (optional subtle effect matching the minimal vibe)
        function createConfetti() {
            const colors = ['#bfa15f', '#d4b472', '#ffffff'];
            for(let i=0; i<50; i++) {
                let div = document.createElement('div');
                div.style.position = 'absolute';
                div.style.width = Math.random() * 8 + 4 + 'px';
                div.style.height = Math.random() * 8 + 4 + 'px';
                div.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                div.style.top = '50%';
                div.style.left = '50%';
                div.style.opacity = Math.random();
                div.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                div.style.pointerEvents = 'none';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 50 + Math.random() * 150;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity - 100;
                
                div.style.transition = `all ${1 + Math.random()}s cubic-bezier(0.1, 0.8, 0.3, 1)`;
                document.body.appendChild(div);
                
                setTimeout(() => {
                    div.style.transform = `translate(${tx}px, ${ty}px) rotate(${Math.random() * 360}deg)`;
                    div.style.opacity = '0';
                }, 10);
                
                setTimeout(() => { document.body.removeChild(div); }, 2000);
            }
        }
        
        setTimeout(createConfetti, 400);
    </script>
</body>
</html>
